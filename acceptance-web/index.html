<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地图表现 Evidence 复核</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="workspace">
      <header class="topbar">
        <section class="identity" aria-label="页面标题">
          <h1>地图表现 Evidence 复核</h1>
          <p>evidence.jsonl -> 地图图例 / 情景区间 / Web 清洗轨迹 / 统计</p>
        </section>
        <section class="toolbar" aria-label="导入和地图操作">
          <label class="file-button">
            导入目录
            <input id="folderInput" type="file" webkitdirectory directory multiple />
          </label>
          <label class="file-button secondary">
            选择多个 evidence.jsonl
            <input id="fileInput" type="file" multiple />
          </label>
          <button id="fitBoundsButton" type="button">适配地图</button>
          <button id="clearButton" type="button">清空</button>
        </section>
        <div id="importStatus" class="import-status" aria-live="polite">
          <span id="importSpinner" class="import-spinner" aria-hidden="true"></span>
          <span id="importText" class="import-text">等待导入 evidence.jsonl</span>
        </div>
      </header>

      <section class="layout">
        <section class="map-area" aria-label="地图预览">
          <div id="mapView" class="map-view"></div>
          <div class="map-filter-panel" aria-label="地图筛选条件">
            <div class="map-filter-group-title">主对照</div>
            <label class="toggle"><input id="showCleaned" type="checkbox" checked /> 清洗成品线</label>
            <label class="toggle" title="流式引擎(设备参考)清洗线。WIP:目前与批处理成品线有分歧(距离偏低),仅供对比诊断。"><input id="showStreaming" type="checkbox" /> 流式线(WIP)</label>
            <label class="toggle" title="原生 Dart 流式引擎清洗线,由本地服务(cd packages/track_cleaning &amp;&amp; dart run bin/serve.dart,默认 :8787)现算。用默认 config。【单发形态】与 JS 流式线同形态,两线重合即证明 Dart 移植与 JS 权威源逐点一致。"><input id="showDart" type="checkbox" /> Dart 引擎线(单发)</label>
            <label class="toggle" title="C++ core 清洗线 —— 迁移后的真源,四端(手机/手表/watchOS)最终跑的就是它。同一个本地服务的 ?engine=cpp,需先构建 core:bash core/build.sh。【分块形态】C ABI 只有这一种形态,与另两条线的单发形态语义不同:48 条金样本里 4 条产物不同,那是形态差异不是实现差异,勿据此判断 C++ 移植有问题。"><input id="showCpp" type="checkbox" /> C++ core 线(分块)</label>
            <label class="toggle"><input id="showRaw" type="checkbox" checked /> 原始轨迹线</label>
            <label class="toggle"><input id="showScenarios" type="checkbox" checked /> 情景范围面</label>
            <div class="map-filter-group-title">复核叠加</div>
            <label class="toggle"><input id="showDirection" type="checkbox" checked /> 方向箭头</label>
            <div class="map-filter-group-title">点证据</div>
            <label class="toggle"><input id="showCleanedPoints" type="checkbox" /> 清洗点</label>
            <label class="toggle"><input id="showPoints" type="checkbox" /> 原始点</label>
            <div class="map-filter-group-title">地形背景</div>
            <label class="toggle"><input id="showTerrain" type="checkbox" /> 地形阴影</label>
            <label class="toggle"><input id="showContours" type="checkbox" checked /> 等高线</label>
            <input id="showTrusted" type="checkbox" hidden />
          </div>
          <div class="map-legend">
            <span><i class="line raw"></i>原始轨迹线</span>
            <span><i class="line cleaned"></i>清洗成品线</span>
            <span><i class="polygon scenario"></i>情景范围面</span>
            <span><i class="line repaired"></i>情景高亮段</span>
            <span><i class="line conflict"></i>局部冲突线</span>
            <span><i class="line spine-conflict"></i>保方向冲突线</span>
          </div>
          <section id="currentProblemPanel" class="panel current-problem-panel" aria-label="当前问题">
            <div class="panel-title">
              <h2>当前问题</h2>
              <div class="panel-title-actions">
                <span id="scenarioRangeState">-</span>
              </div>
            </div>
            <details class="manual-range-control">
              <summary>按编号查看</summary>
              <div class="scenario-review-controls">
                <label>清洗点区间<input id="scenarioRangeInput" type="text" placeholder="1836-1919" /></label>
                <button id="scenarioRangeReviewButton" type="button">查看</button>
              </div>
            </details>
            <div id="scenarioRangeReview" class="summary-list scenario-review-results"></div>
          </section>
        </section>

        <aside class="right-panel" aria-label="地图表现复核面板">
          <section id="reviewOverviewPanel" class="panel review-overview-panel">
            <div class="panel-title">
              <h2>复核样本</h2>
              <span id="reviewDatasetState">等待导入</span>
            </div>
            <div id="reviewDatasetOverview" class="summary-list review-overview"></div>
          </section>

          <section id="reviewTaskPanel" class="panel">
            <div class="panel-title">
              <h2>复核任务</h2>
              <span id="cleaningConfigState">等待导入</span>
            </div>
            <div id="cleaningAlgorithm" class="summary-list algorithm-list"></div>
          </section>

          <section class="panel details-panel">
            <div class="panel-title">
              <h2>证据详情</h2>
              <span id="selectedPointText">-</span>
            </div>
            <div id="pointDetails" class="point-details">
              <p class="empty-note">选择地图上的点后显示</p>
            </div>
          </section>
        </aside>
      </section>
    </main>

    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
    <script type="module" src="./src/main.mjs"></script>
  </body>
</html>
