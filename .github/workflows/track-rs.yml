name: track-rs

on:
  pull_request:
    paths:
      - "acceptance-web/**"
      - "track-rs/**"
      - "docs/track-sdk-public-api-contract.md"
      - "docs/watchos-rust-core-migration.md"
      - "docs/watchos-rust-streaming-track-core.md"
  workflow_dispatch:
    inputs:
      verifyAppleXcframework:
        description: "Build TrackCore.xcframework"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  verify:
    runs-on: macos-14
    defaults:
      run:
        working-directory: track-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: >-
            aarch64-apple-ios,
            aarch64-apple-ios-sim,
            aarch64-apple-watchos,
            aarch64-apple-watchos-sim
      - name: Verify Track Rust core
        env:
          VERIFY_APPLE_XCFRAMEWORK: ${{ github.event_name == 'workflow_dispatch' && inputs.verifyAppleXcframework == 'true' && '1' || '0' }}
        run: ./scripts/verify-track-core.sh
